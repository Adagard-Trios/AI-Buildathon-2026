# Full platform stack for FirstStep.
#
#   docker compose up --build      then open http://localhost:3000
#
# Ports are assigned by convention: 8000 + component number, the shared platform service on
# 8100 and the OData gateway on 8080.
#
# Network exposure (zero trust: being on the network grants nothing, and nothing is reachable
# that does not need to be):
#   * Host ports bind to ${BIND_ADDR:-127.0.0.1}: only this machine reaches the stack. To test
#     the mobile app from a phone on the same Wi-Fi, run with BIND_ADDR=0.0.0.0.
#   * Kafka sits on the internal "bus" network with only Component 1 attached, and publishes
#     no host port. MLflow is bound to 127.0.0.1 regardless of BIND_ADDR.

services:
  # --- shared services ------------------------------------------------------------------
  platform:
    build:
      context: ./backend/Platform
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8100:8100"
    environment:
      # RS256: this is the ONLY service that can mint tokens. The private key is generated on
      # first start into the platform_data volume and never leaves it; every other component
      # verifies with the public key at /.well-known/jwks.json. No shared secret exists.
      PLATFORM_SIGNING_KEY_FILE: /app/artifacts/signing_key.pem
      PLATFORM_SIGNING_KEY_AUTOGEN: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: sqlite:////app/artifacts/platform.sqlite
      # Machine identities, "id:secret:scope1 scope2;id2:...". Required: with auth on, a component
      # without one cannot anchor its decisions in Component 3, and it would fail silently.
      SERVICE_CLIENTS: ${SERVICE_CLIENTS:?set SERVICE_CLIENTS in .env (see .env.example)}
      PLATFORM_ROLES: ${PLATFORM_ROLES:-}    # "email:auditor admin;..." -- who may review / reset audit records
    volumes:
      # Users and portfolios must outlive the container, or every restart wipes the accounts.
      - platform_data:/app/artifacts
      - ./shared/odata:/app/shared_odata:ro
    restart: unless-stopped

  component1:
    build:
      context: ./backend/Portfolio-Optimization
      dockerfile: docker/Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      AUDIT_URL: http://component3:8002
      PLATFORM_URL: http://platform:8100
      SERVICE_CLIENT_ID: ${PORTFOLIO_CLIENT_ID:?set PORTFOLIO_CLIENT_ID in .env}
      SERVICE_CLIENT_SECRET: ${PORTFOLIO_CLIENT_SECRET:?set PORTFOLIO_CLIENT_SECRET in .env}
      PLATFORM_JWKS_URL: http://platform:8100/.well-known/jwks.json   # verify only; nothing here can mint
      AUTH_REQUIRED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      MLFLOW_TRACKING_URI: sqlite:///artifacts/mlflow.db
    volumes:
      - ./shared/odata:/app/shared_odata:ro
      # The model registry lives here; Component 3 anchors model_version on-chain, so a
      # version that vanished on restart would break its provenance chain.
      - ./backend/Portfolio-Optimization/artifacts:/app/artifacts
    networks: [default, bus]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the client bundle, never read
        # at runtime. These are the URLs the BROWSER uses, so they are localhost — not the
        # compose service names, which only resolve inside the network.
        NEXT_PUBLIC_PLATFORM_URL: http://localhost:8100
        NEXT_PUBLIC_PORTFOLIO_URL: http://localhost:8000
        NEXT_PUBLIC_FRAUD_URL: http://localhost:8001
        NEXT_PUBLIC_AUDIT_URL: http://localhost:8002
        NEXT_PUBLIC_ASSISTANT_URL: http://localhost:8003
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - platform
      - component1
    restart: unless-stopped

  # --- supporting infrastructure ---------------------------------------------------------
  kafka:
    # KRaft mode, no ZooKeeper. One broker is enough: the design brief calls for a local event bus,
    # not a production cluster.
    #
    # The official Apache image, not bitnami/kafka -- Bitnami withdrew its public catalogue
    # in 2025 and `bitnami/kafka:3.7` no longer resolves on Docker Hub. The variables differ:
    # Apache takes plain Kafka property names (KAFKA_NODE_ID), Bitnami infixed them
    # (KAFKA_CFG_NODE_ID), so this is the same broker described in the other dialect.
    image: apache/kafka:3.7.2
    # No host port and no external listener: only services on the internal "bus" network
    # (Component 1) can reach the broker.
    networks: [bus]
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # A single broker cannot replicate anything; the defaults of 3 leave the internal
      # topics permanently under-replicated and consumer groups never stabilise.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: FirstStepLocalBusAA
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    # The tracking UI has no authentication, so it is never exposed beyond this machine.
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    volumes:
      - ./backend/Portfolio-Optimization/artifacts/mlruns:/mlruns
    restart: unless-stopped

  gateway:
    # The single entry point for EXTERNAL systems (core banking, BI tools, regulators): OData
    # routing to every component, token verified here and again by each service (the
    # caller's Authorization header is forwarded unchanged; no implicit trust between hops).
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/Gateway:/app
      - ./shared/odata:/app/shared_odata:ro
      - ./shared/auth:/app/shared_auth:ro
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8080"
    ports: ["${BIND_ADDR:-127.0.0.1}:8080:8080"]
    environment:
      PLATFORM_JWKS_URL: http://platform:8100/.well-known/jwks.json   # verify only; nothing here can mint
      AUTH_REQUIRED: "true"
      AUDIT_URL: http://component3:8002
      UPSTREAM_PLATFORM: http://platform:8100
      UPSTREAM_PORTFOLIO: http://component1:8000
      UPSTREAM_FRAUD: http://component2:8001
      UPSTREAM_AUDIT: http://component3:8002
      UPSTREAM_ASSISTANT: http://component4:8003
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # --- teammates' components ---------------------------------------------------------------
  # None of these add a file to anyone's folder. Each runs from a stock image with the
  # component bind-mounted, so the only thing this file knows about them is how to start
  # them and where to check they are alive.
  #
  # Every one is `restart: unless-stopped` and nothing depends_on them: a teammate's service
  # failing to start must never take the rest of the platform down with it.

  component2:                      # Fraud Detection  (Dhushanthini R)
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/Fraud-Detection:/app
      - ./shared/odata:/app/shared_odata:ro
      - ./shared/auth:/app/shared_auth:ro
    # Its detection logic is pure standard library -- fastapi, uvicorn and pydantic are the
    # whole dependency list -- so installing at start costs seconds and needs no Dockerfile.
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn app:app --host 0.0.0.0 --port 8001"
    ports: ["${BIND_ADDR:-127.0.0.1}:8001:8001"]
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      PLATFORM_JWKS_URL: http://platform:8100/.well-known/jwks.json   # verify only; nothing here can mint
      AUTH_REQUIRED: "true"
      AUDIT_URL: http://component3:8002      # denials are anchored by Component 3
      PLATFORM_URL: http://platform:8100
      SERVICE_CLIENT_ID: ${FRAUD_CLIENT_ID:?set FRAUD_CLIENT_ID in .env}
      SERVICE_CLIENT_SECRET: ${FRAUD_CLIENT_SECRET:?set FRAUD_CLIENT_SECRET in .env}
      DEMO_MODE: "true"                       # step-up demo_code; must be false in production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LAYA_ENDPOINT: ${LAYA_ENDPOINT:-}
      LAYA_LANGS_VALIDATED: ${LAYA_LANGS_VALIDATED:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  component3:                      # Blockchain Auditability  (Abeysekara W C S M)
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./backend/Blockchain-Auditability/backend:/app
    # PORT is read from the environment by its index.js, so it runs on 8002 without any
    # change to the source.
    command: sh -c "npm install --silent && node src/index.js"
    ports: ["${BIND_ADDR:-127.0.0.1}:8002:8002"]
    environment:
      PORT: "8002"
      DEMO_MODE: "true"   # enables the Tamper action; must be false in production
      PLATFORM_JWKS_URL: http://platform:8100/.well-known/jwks.json   # verify only; nothing here can mint
      AUTH_REQUIRED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8002/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  component4:                      # Agentic Assistance  (W V A D K Chamara)
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/Agentic-Assistance:/app
      - ./shared/odata:/app/shared_odata:ro
      - ./shared/auth:/app/shared_auth:ro
    # Its own requirements.txt, rather than a guessed package list. An earlier version of
    # this file installed langchain-openai and shap: neither is used by the service, and it
    # omitted langchain-ollama, which is.
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8003"
    ports: ["${BIND_ADDR:-127.0.0.1}:8003:8003"]
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      # The agent talks to OLLAMA, not OpenAI -- agent.py uses ChatOllama. Inside a
      # container "localhost" is the container, so it has to be pointed at the host
      # explicitly or every chat call fails with a connection error.
      OLLAMA_HOST: http://host.docker.internal:11434
      PLATFORM_JWKS_URL: http://platform:8100/.well-known/jwks.json   # verify only; nothing here can mint
      AUTH_REQUIRED: "true"
      FRAUD_URL: http://component2:8001
      AUDIT_URL: http://component3:8002      # denials are anchored by Component 3
      PLATFORM_URL: http://platform:8100
      SERVICE_CLIENT_ID: ${ASSISTANT_CLIENT_ID:?set ASSISTANT_CLIENT_ID in .env}
      SERVICE_CLIENT_SECRET: ${ASSISTANT_CLIENT_SECRET:?set ASSISTANT_CLIENT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GUARDIAN_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

networks:
  # Internal: no route to the host or the internet, so the plaintext broker is unreachable
  # from anything but the services explicitly attached.
  bus:
    internal: true

volumes:
  platform_data:
  kafka_data:
